name: CI

# Trunk-based development: main is always releasable. Every push to main and every PR targeting
# main runs the same gate (lint + tests) before merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run test suite
        # No Redis service container needed: tests fake/patch Redis directly (see
        # tests/fakes.py). USE_FAKE_REDIS is deliberately NOT set here -- one test
        # (test_redis_client_initialization_pings_server) asserts core.redis_client falls
        # through to a real redis.from_url() call (mocked), which USE_FAKE_REDIS would
        # short-circuit, breaking that test.
        run: python -m unittest discover -s tests -v
