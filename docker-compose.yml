# Local infrastructure for the Teton backend: Redis (hot state).
# The service itself runs on the host (uvicorn) and connects to Redis on localhost,
# matching the default in config.py (REDIS_URL).

services:
  redis:
    # Latest stable Redis line. The abandoned native Windows port is stuck at 3.0.504, which
    # predates variadic HSET (added in 4.0) and breaks the presence handler; run a modern build
    # via Docker instead. 8.x supports every command our handlers use (SET EX/NX, zsets,
    # variadic HSET, pipelines).
    image: redis:8-alpine
    container_name: teton-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
