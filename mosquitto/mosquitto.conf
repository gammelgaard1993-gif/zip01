# Mosquitto broker configuration for the Teton backend.
# QoS 1 delivery with persistent sessions is handled per-client; the broker
# just needs an open listener and on-disk persistence for durability.

listener 1883
# No auth/ACL: this broker is for local/challenge use only, bound to a private
# docker-compose network with no listener exposed beyond localhost (see
# docker-compose.yml). A production deployment would add `password_file` +
# per-client ACLs before exposing this listener on a shared network.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Keep retained/queued messages for offline (persistent-session) clients so a
# subscriber that reconnects after a restart still receives QoS 1 messages.
max_queued_messages 1000000
# Bounds worst-case queued memory per client independent of message count (a client offline
# with its queue full of near-MAX_EVENT_BYTES messages could otherwise approach
# max_queued_messages * MAX_EVENT_BYTES ~ 16GB); 512 MiB is a generous ceiling for this
# workload's actual message sizes (a few hundred bytes each).
max_queued_bytes 536870912
persistent_client_expiration 1h

# QoS-1 backpressure window. 
max_inflight_messages 2000

log_dest stdout
log_type warning
log_type notice
log_type information
